# Capability catalog (spec section 3).
#
# Capabilities are NEUTRAL verbs carried by edges. Sensitivity, externality and
# risk are NEVER encoded in the capability name (no "readSensitive", no
# "sendExternal"); they are derived from the target node's properties.
#
# Each entry documents the verb and the node kinds it typically connects.
# Organized into 9 phases of the agent cognitive cycle:
# perception → understanding → reasoning → transformation →
# execution → communication → memory → control → monitoring
capabilities:

  # ── 1. Perception ──────────────────────────────────────────────────────────

  receiveInstruction:
    description: An input delivers instructions/content to an agent.
    typical_source: input
    typical_target: agent

  receiveEvent:
    description: An input delivers an event or trigger signal that initiates the agent flow.
    typical_source: input
    typical_target: agent

  read:
    description: Read data from a data asset or tool.
    typical_source: agent
    typical_target: data_asset

  search:
    description: Search/query over a data asset (a refinement of read).
    typical_source: agent
    typical_target: data_asset

  fetchWeb:
    description: Retrieve external web/network content. Primary vector for indirect prompt injection.
    typical_source: agent
    typical_target: data_asset

  observeState:
    description: Query the current state of a system, process or resource without modifying it.
    typical_source: agent
    typical_target: tool

  # ── 2. Understanding / interpretation ──────────────────────────────────────

  extractInformation:
    description: Extract structured information from content (a refinement of read).
    typical_source: agent
    typical_target: data_asset

  classify:
    description: Assign a category, label, priority or type to an element.
    typical_source: agent
    typical_target: data_asset

  summarize:
    description: Reduce information while preserving what is essential.
    typical_source: agent
    typical_target: data_asset

  interpretIntent:
    description: Infer what a user or system wants to achieve from an instruction.
    typical_source: agent
    typical_target: input

  validate:
    description: Check whether something meets rules, format or conditions.
    typical_source: agent
    typical_target: data_asset

  # ── 3. Reasoning / decision ─────────────────────────────────────────────────

  plan:
    description: Decompose an objective into an executable sequence of steps.
    typical_source: agent
    typical_target: agent

  decide:
    description: Choose between alternatives according to criteria.
    typical_source: agent
    typical_target: agent

  infer:
    description: Deduce information not explicitly present from available data.
    typical_source: agent
    typical_target: agent

  prioritize:
    description: Order actions or items by importance.
    typical_source: agent
    typical_target: agent

  resolveConflict:
    description: Handle inconsistencies between sources, constraints or instructions.
    typical_source: agent
    typical_target: agent

  # ── 4. Information transformation ───────────────────────────────────────────

  rewrite:
    description: Modify form, tone, structure or style of content while preserving meaning.
    typical_source: agent
    typical_target: data_asset

  translate:
    description: Convert content between human languages or between formal languages (e.g. NL→SQL).
    typical_source: agent
    typical_target: data_asset

  convertFormat:
    description: Transform data from one format to another without changing its semantics.
    typical_source: agent
    typical_target: data_asset

  normalizeData:
    description: Homogenize structures, units or values to a canonical form.
    typical_source: agent
    typical_target: data_asset

  enrichData:
    description: Add additional information by consulting other sources.
    typical_source: agent
    typical_target: data_asset

  generateContent:
    description: Create new content (textual, structured or code) where none existed before.
    typical_source: agent
    typical_target: data_asset

  # ── 5. Execution / action ───────────────────────────────────────────────────

  executeCode:
    description: Execute code / shell commands.
    typical_source: agent
    typical_target: tool

  invokeTool:
    description: Invoke a tool (wraps a concrete operation).
    typical_source: agent
    typical_target: tool

  send:
    description: Send data to an output/sink.
    typical_source: agent
    typical_target: output

  createResource:
    description: Create a new resource (additive side effect).
    typical_source: agent
    typical_target: output

  modifyResource:
    description: Modify an existing resource (mutating side effect).
    typical_source: agent
    typical_target: output

  deleteResource:
    description: Delete a resource (destructive, often irreversible).
    typical_source: agent
    typical_target: output

  moveResource:
    description: Change the location of or duplicate data (e.g. copy to public storage, export file).
    typical_source: agent
    typical_target: data_asset

  deployRelease:
    description: Make a resource or change available in a production environment.
    typical_source: agent
    typical_target: tool

  # ── 6. Communication ────────────────────────────────────────────────────────

  respondUser:
    description: Return a reply, explanation or result to the user who originated the request.
    typical_source: agent
    typical_target: output

  notify:
    description: Proactively inform a person or system of an event or result.
    typical_source: agent
    typical_target: output

  requestInformation:
    description: Ask a person for missing data, clarification or approval.
    typical_source: agent
    typical_target: output

  delegateTo:
    description: Delegate work/authority to another agent.
    typical_source: agent
    typical_target: agent

  dataFlow:
    description: Generic propagation of data between nodes.
    typical_source: agent
    typical_target: agent

  escalate:
    description: Transfer a situation to a higher-level person, team or system.
    typical_source: agent
    typical_target: output

  # ── 7. Memory and context ───────────────────────────────────────────────────

  readMemory:
    description: Read from a memory store.
    typical_source: agent
    typical_target: memory

  writeMemory:
    description: Write to a memory store.
    typical_source: agent
    typical_target: memory

  updateContext:
    description: Maintain relevant information during a task or session (short-term memory).
    typical_source: agent
    typical_target: memory

  forgetContext:
    description: Remove irrelevant, sensitive or expired context.
    typical_source: agent
    typical_target: memory

  manageWorkflowState:
    description: Maintain the progress of a multi-step task or workflow.
    typical_source: agent
    typical_target: memory

  # ── 8. Control and security ─────────────────────────────────────────────────

  authenticate:
    description: Obtain or use credentials to access resources.
    typical_source: agent
    typical_target: tool

  authorize:
    description: Check permissions before acting.
    typical_source: agent
    typical_target: tool

  requestConfirmation:
    description: Request explicit approval before a sensitive action.
    typical_source: agent
    typical_target: output

  auditLog:
    description: Record actions, decisions and outcomes for traceability.
    typical_source: agent
    typical_target: output

  protectInformation:
    description: Apply transformations to prevent improper data exposure (redaction, encryption).
    typical_source: agent
    typical_target: data_asset

  detectRisk:
    description: Identify dangerous, anomalous or disallowed actions before executing them.
    typical_source: agent
    typical_target: input

  # ── 9. Monitoring and recovery ──────────────────────────────────────────────

  verifyResult:
    description: Check that an action produced the expected effect.
    typical_source: agent
    typical_target: tool

  handleError:
    description: Detect, interpret and respond to failures.
    typical_source: agent
    typical_target: agent

  retry:
    description: Re-execute an action after a transient failure.
    typical_source: agent
    typical_target: tool

  rollback:
    description: Revert a previous action or change.
    typical_source: agent
    typical_target: tool

  recordProgress:
    description: Maintain a persistent trace of steps performed.
    typical_source: agent
    typical_target: output

  finalizeTask:
    description: Formally close a task with an explicit result.
    typical_source: agent
    typical_target: output
