# Control catalog (spec section 11) - Phase 2.
#
# Controls are first-class mitigations. Each declares the capability kinds it
# breaks or mitigates and an effect:
#   - effect: total   -> an affected edge is marked `blocked` and cut from the
#                        recomputed graph, so any attack path through it disappears.
#   - effect: partial -> an affected edge is marked `mitigated`; the hop is NOT
#                        cut, but every surviving finding whose path crosses it
#                        loses MITIGATION_CREDIT from its score. Only `blocked`
#                        (total-effect) edges are excluded from attack-path
#                        traversal.
#
# `cost` and `demo_priority` are presentation hints surfaced by the control
# recommender (spec section 12.5). `status` is runtime state (absent until a
# control is applied in a simulation) and is therefore NOT stored here.
#
# Capability kinds must be verbs from capabilities.yaml (spec section 3). The
# richer FH-010/011/014 controls are catalogued now for completeness even though
# those rules land in Phase 3.
controls:
  - id: humanInTheLoop
    name: Human approval
    category: decision
    breaks_capability_kinds:
      - send
      - executeCode
      - createResource
      - modifyResource
      - deleteResource
      - invokeTool
    effect: total
    cost: low
    demo_priority: must_show

  - id: leastPrivilege
